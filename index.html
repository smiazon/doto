<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>doto</title>
<meta name="theme-color" content="#f3e9d3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b140d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="doto">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#d6c6a5; --page:#f3e9d3; --ink:#3b2a1a; --soft:#a08a6b; --rule:#e6d8bc;
  --deboss:rgba(255,250,235,.7); --shadow:rgba(70,45,15,.22); --grain:.12; --grain-invert:0;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#0e0a06; --page:#1b140d; --ink:#e6d5b6; --soft:#8c7659; --rule:#2e2419;
    --deboss:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.6); --grain:.07; --grain-invert:1; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#0e0a06; --page:#1b140d; --ink:#e6d5b6; --soft:#8c7659; --rule:#2e2419;
  --deboss:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.6); --grain:.07; --grain-invert:1; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html.swap *,html.swap *::before,html.swap *::after{transition:none!important}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){z-index:2}

html{height:100%;background:var(--desk)}
body{margin:0;min-height:100%;background:var(--desk);color:var(--ink);
  font-family:"Literata",Georgia,"Iowan Old Style","Times New Roman",serif;font-size:18px;line-height:1.5;
  -webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--desk)}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
a{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px;border-radius:2px}

.grain{position:fixed;inset:-50%;width:200%;height:200%;pointer-events:none;z-index:30;opacity:var(--grain);filter:invert(var(--grain-invert));
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .12  0 0 0 0 .04  0 0 0 1.1 -.1'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain .9s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-4%)}60%{transform:translate(-4%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}

.page{--padx:2.75rem;position:relative;max-width:30rem;min-height:calc(100vh - 5rem);margin:2.5rem auto;background:var(--page);
  padding:0 var(--padx) 3rem;display:flex;flex-direction:column;transition:background .4s;text-shadow:0 1px 0 var(--deboss);
  filter:drop-shadow(0 1px 1px var(--shadow)) drop-shadow(0 14px 18px rgba(60,40,15,.1))}
@media (max-width:600px){
  body::before{background:var(--page)}
  .page{--padx:1.6rem;margin:0;min-height:100vh;filter:none;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 2.5rem)}
}
.top{position:relative;height:3.6rem}
.lamp{position:absolute;left:0;top:calc(1.6rem + .45rem);width:.8rem;height:.8rem;border-radius:50%;border:1.2px solid var(--soft);
  background:linear-gradient(90deg,var(--soft) 50%,transparent 50%);cursor:pointer;padding:0}
.lamp::after{content:"";position:absolute;inset:-.7rem}

h1{margin:22vh 0 0;text-align:center;font-weight:400;font-style:italic;font-size:3.4rem;line-height:1;letter-spacing:.01em}
@media (max-height:640px){h1{margin-top:12vh}}

/* the contents page of a small book */
.toc{list-style:none;margin:4.25rem 0 0;padding:0}
.toc li+li{margin-top:.35rem}
.toc a{display:flex;align-items:baseline;gap:.5rem;padding:.7rem 0;color:inherit;text-decoration:none}
.toc .name{font-size:1.3rem}
.toc .lead{flex:1;min-width:1rem;border-bottom:1.5px dotted var(--soft);opacity:.55;transform:translateY(-.3rem)}
.toc .stat{font-size:.95rem;color:var(--soft);font-variant-numeric:oldstyle-nums}
.toc a:hover .name,.toc a:focus-visible .name{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.25rem}
.toc a:active{opacity:.6}

.foot{margin-top:auto;padding-top:4rem;display:flex;justify-content:center;gap:2rem;font-size:.88rem}
.foot button{background:none;border:0;padding:.3rem 0;cursor:pointer;color:var(--soft);text-shadow:inherit}
.foot button:hover{color:var(--ink)}
.note{min-height:1.4rem;margin:.6rem 0 0;text-align:center;font-size:.85rem;font-style:italic;color:var(--soft)}
.ask{display:flex;justify-content:center;gap:1.5rem;margin-top:.3rem;font-size:.88rem}
.ask[hidden]{display:none}
.ask button{background:none;border:0;padding:.3rem 0;cursor:pointer;color:var(--soft);border-bottom:1px solid transparent}
.ask .yes{color:var(--ink);border-bottom-color:var(--ink)}
input[type=file]{display:none}
@media (prefers-reduced-motion:reduce){.grain{animation:none}}
</style>
</head>
<body>
<main class="page">
  <div class="top"><button class="lamp" id="lamp" aria-label="Switch light or dark"></button></div>
  <h1>doto</h1>
  <ul class="toc">
    <li><a href="tasks/"><span class="name">Tasks</span><span class="lead" aria-hidden="true"></span><span class="stat" id="sTasks"></span></a></li>
    <li><a href="projects/"><span class="name">Projects</span><span class="lead" aria-hidden="true"></span><span class="stat" id="sProjects"></span></a></li>
  </ul>
  <div class="foot">
    <button id="save">Save a backup</button>
    <button id="restore">Restore a backup</button>
  </div>
  <p class="note" id="note" role="status"></p>
  <div class="ask" id="ask" hidden>
    <button class="yes" id="yes">Replace</button>
    <button id="keep">Keep mine</button>
  </div>
  <input type="file" id="file" accept="application/json,.json">
</main>
<div class="grain" aria-hidden="true"></div>

<script>
const KEYS = { tasks: 'doto-v1', projects: 'dotoplus-v1' }, THEME = 'doto-theme';
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const read = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };

/* light / dark, shared with both apps */
const sysDark = matchMedia('(prefers-color-scheme: dark)');
let theme = null; try { theme = localStorage.getItem(THEME); } catch (e) {}
const isDark = () => theme ? theme === 'dark' : sysDark.matches;
const applyTheme = () => theme ? document.documentElement.setAttribute('data-theme', theme) : document.documentElement.removeAttribute('data-theme');
function swapTheme() {
  const next = isDark() ? 'light' : 'dark', root = document.documentElement;
  const apply = () => { theme = next; try { localStorage.setItem(THEME, theme); } catch (e) {} applyTheme(); };
  const done = () => requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('swap')));
  root.classList.add('swap');
  if (!document.startViewTransition || reduce) { apply(); done(); return; }
  const r = $('lamp').getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  const R = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const t = document.startViewTransition(apply);
  t.ready.then(() => root.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${R}px at ${x}px ${y}px)`] },
    { duration: 720, easing: 'cubic-bezier(.45,0,.2,1)', pseudoElement: '::view-transition-new(root)' })).catch(() => {});
  t.finished.finally(done);
}
$('lamp').onclick = swapTheme;
applyTheme();

/* where each book stands */
function today() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function stats() {
  const t = read(KEYS.tasks), day = t && t.days && t.days[today()];
  if (!day || !day.tasks || !day.tasks.length) $('sTasks').textContent = 'nothing yet today';
  else if (day.closed) $('sTasks').textContent = 'today is finished';
  else $('sTasks').textContent = day.tasks.filter(x => x.done).length + ' of ' + day.tasks.length + ' today';
  const p = read(KEYS.projects), open = p && p.projects ? p.projects.filter(x => !x.closed).length : 0;
  $('sProjects').textContent = open ? open + ' open' : 'none open';
}
stats();
addEventListener('pageshow', stats);

/* backups: one file holding both apps */
let noteTimer = 0;
const note = msg => { $('note').textContent = msg; clearTimeout(noteTimer); noteTimer = setTimeout(() => $('note').textContent = '', 4000); };

$('save').onclick = () => {
  const data = { app: 'doto', version: 1, savedAt: new Date().toISOString(), tasks: read(KEYS.tasks), projects: read(KEYS.projects) };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = 'doto-backup-' + today() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  note('Backup saved to your downloads.');
};

let pending = null;
$('restore').onclick = () => { $('file').value = ''; $('file').click(); };
$('file').onchange = async () => {
  const f = $('file').files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || data.app !== 'doto') throw 0;
    if (!data.tasks && !data.projects) { note('That backup is empty.'); return; }
    pending = data;
    $('note').textContent = 'Replace your tasks and projects with the backup from ' + (data.savedAt ? new Date(data.savedAt).toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' }) : 'this file') + '?';
    clearTimeout(noteTimer);
    $('ask').hidden = false; $('yes').focus();
  } catch (e) { note('That file isn’t a doto backup.'); }
};
$('yes').onclick = () => {
  if (!pending) return;
  try {
    if (pending.tasks) localStorage.setItem(KEYS.tasks, JSON.stringify(pending.tasks));
    if (pending.projects) localStorage.setItem(KEYS.projects, JSON.stringify(pending.projects));
    note('Backup restored.');
  } catch (e) { note('This browser wouldn’t store the backup. Check that site storage is allowed.'); }
  pending = null; $('ask').hidden = true; stats();
};
$('keep').onclick = () => { pending = null; $('ask').hidden = true; note('Nothing changed.'); };

if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
